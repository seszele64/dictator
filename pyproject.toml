[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-dictate"
dynamic = ["version"]
description = "Voice dictation using OpenAI Whisper API with strong typing and logging"
requires-python = ">=3.11"
authors = [{name = "whisper-dictate contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydub==0.25.1",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.scripts]
whisper-dictate = "whisper_dictate.cli:cli"
whisper-dictate-toggle = "whisper_dictate.toggle:cli"

[tool.hatch.version]
path = "whisper_dictate/__init__.py"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
]

[tool.pytest.ini_options]
timeout = 30
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "timeout: mark test with specific timeout override",
    "unit: fast isolated tests with no real DB, filesystem or system binaries",
    "integration: tests exercising real SQLite database and filesystem (offline)",
    "e2e: full-system tests that require system binaries (dunstify, xclip)",
    "contract: provider contract tests pinning external transcription seams",
]

[tool.coverage.run]
source = ["whisper_dictate"]
branch = true
relative_files = true

[tool.coverage.report]
# Gate: fail the suite below 70% combined statement+branch coverage.
# Measured floor at introduction was 83% (branch enabled), so 70 is a
# conservative ratchet, not an aspiration.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
