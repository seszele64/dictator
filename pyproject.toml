[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-dictate"
dynamic = ["version"]
description = "Voice dictation using OpenAI Whisper API with strong typing and logging"
requires-python = ">=3.11"
authors = [{name = "whisper-dictate contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydub==0.25.1",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.scripts]
whisper-dictate = "whisper_dictate.cli:cli"
whisper-dictate-toggle = "whisper_dictate.toggle:cli"

[tool.hatch.version]
path = "src/whisper_dictate/__init__.py"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "pre-commit>=3.0.0",
]

[tool.pytest.ini_options]
timeout = 30
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "timeout: mark test with specific timeout override",
    "unit: fast isolated tests with no real DB, filesystem or system binaries",
    "integration: tests exercising real SQLite database and filesystem (offline)",
    "e2e: full-system tests that require system binaries (dunstify, xclip)",
    "contract: provider contract tests pinning external transcription seams",
    "contract_live: live provider contract test against the real API; opt-in via WHISPER_DICTATE_LIVE_CONTRACT",
]

[tool.coverage.run]
source = ["whisper_dictate"]
branch = true
relative_files = true

[tool.coverage.report]
# Gate: fail the suite below 70% combined statement+branch coverage.
# Measured floor at introduction was 83% (branch enabled), so 70 is a
# conservative ratchet, not an aspiration.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/whisper_dictate"]
warn_unused_ignores = true

# Ratchet policy (D3, locked 2026-09-02; updated P7 2026-09-02):
#   * Every `whisper_dictate` module is type-checked under `strict = true` by
#     default — a new module is picked up automatically and must be strict.
#   * Opt-out is allowed ONLY via an explicit per-module override in this file,
#     and overrides may only be REMOVED (never added) without owner approval.
#     `dunst_monitor.py` was strict-clean at P7 introduction — it carries no
#     override. `cli.py` is the sole lax island until the S3 god-module split.
#   * `# type: ignore[code]` needs a one-line why; `warn_unused_ignores` prunes
#     stale ignores so the ratchet can never silently loosen.

[[tool.mypy.overrides]]
# D3 (2026-09-02): cli.py is the sole approved lax module — god-module slated
# for the S3 split; bodies are still type-checked via check_untyped_defs.
# (Per-module `strict = false` is a silent no-op in mypy 2.x; explicit flags
# are the only reliable per-module lax mechanism.)
module = "whisper_dictate.cli"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
strict_equality = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Untyped third-party libraries (no py.typed marker shipped).
# Every OTHER third-party dependency must be py.typed or it errors loudly here.
module = ["soundfile", "sounddevice", "pydub"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
# Keep `ruff format` .py-only: ruff 0.16 formats Python fenced code blocks in
# Markdown files by default, which would churn archived openspec docs in the
# format pass. Owner decision (P8): the adopt-ruff-format diff stays .py-only.
extend-exclude = ["*.md"]
# src layout: tells ruff (isort/I001) that `whisper_dictate.*` imports are
# first-party, resolving against src/ instead of the project root. The repo
# root stays listed so `tests.*` imports (tests/ lives at the root) are still
# classified first-party.
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
