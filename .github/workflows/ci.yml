# CI for whisper-dictate (P9, Day 7) — uv-native, SHA-pinned actions.
#
# Dependency policy: the environment comes exclusively from uv.lock via
# `uv sync --locked --extra dev` (dev tooling lives in the
# [project.optional-dependencies].dev extra). `--locked` is used deliberately —
# NOT `--frozen`: it asserts that uv.lock is current with pyproject.toml and
# fails loudly on drift, so a stale lockfile can never silently ship to CI.
#

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Skip redundant work: rapid pushes / PR updates cancel the superseded run.
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # mypy is configured for 3.11 semantics ([tool.mypy] python_version).
          python-version: "3.11"
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: mypy (strict core)
        run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Install ffmpeg (P10 golden round-trips need it on runners)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Plain pytest — no --cov here; coverage has its own dedicated job.
      # The suite is hermetic: system binaries (dunstify, xclip) and audio
      # devices are mocked at the seams; ffmpeg is the one exception — the
      # P10 golden round-trips need the real binary, hence the apt install.
      - name: Pytest
        run: uv run --no-sync pytest -q

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Install ffmpeg (P10 golden round-trips need it on runners)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # fail_under=70 is enforced by coverage's own report step (pyproject).
      - name: Pytest with coverage
        run: uv run --no-sync pytest -q --cov --cov-report=json:coverage.json
      - name: Enforce per-module coverage floors
        run: uv run --no-sync python scripts/check_coverage.py --coverage-file coverage.json
      - name: Upload coverage.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      # Export RUNTIME deps only: `--no-emit-project` drops whisper-dictate
      # itself (not on PyPI until P13 — pip-audit would error on it), extras
      # like dev are excluded by default, and `--no-dev` keeps that guarantee
      # even if a [dependency-groups] dev section is added later. `--locked`
      # asserts lock↔pyproject currency, same as `uv sync --locked`.
      - name: Export runtime requirements
        run: uv export --locked --format requirements-txt --no-emit-project --no-dev -o /tmp/requirements.txt
      # The export is fully resolved, so audit exactly those pins (--no-deps)
      # instead of re-resolving; --strict fails on any parse/audit anomaly.
      #
      # Advisory set kept empty by policy: the former click (PYSEC-2026-2132)
      # and idna (PYSEC-2026-215) ignores were cleared 2026-09-04 by
      # `uv lock --upgrade`. Any future advisory must be fixed by a lock
      # refresh, not an ignore.
      - name: pip-audit
        run: uvx pip-audit --strict --no-deps -r /tmp/requirements.txt
